<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World with Fireworks</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: transparent;
        }
        
        h1 {
            position: relative;
            z-index: 1;
            color: white;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    <h1>Hello, World!</h1>
    <script defer src="scripts/fireworks.js"></script>

</body>
</html>
</html>
